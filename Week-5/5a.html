<!DOCTYPE html>
<html>
<head>
    <title>Programming Languages Cards</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f229;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin-top: 30px;
            color: navy;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;   /* makes it responsive */
            padding: 40px;
        }

        .card {
            background-color: white;
            width: 260px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card h3 {
            margin: 15px 0 10px;
            color: darkblue;
        }

        .card p {
            font-size: 14px;
            color: gray;
            padding: 0 15px;
        }

        .card button {
            margin: 15px 0 20px;
            padding: 8px 18px;
            border: none;
            background-color: teal;
            color: white;
            border-radius: 20px;
            cursor: pointer;
        }

        .card button:hover {
            background-color: darkgreen;
        }
    </style>
</head>

<body>

    <h1>Programming Languages</h1>

    <div class="container">

        <!-- Card 1 -->
        <div class="card">
            <img src="https://th.bing.com/th/id/OIP.PC5nKwYN0Y93GuymtkSLsQAAAA?w=224&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="Java">
            <h3>Java</h3>
            <p>Java is a powerful, object-oriented programming language used for web and mobile apps.</p>
            <button>Learn More</button>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <img src="https://imgcdn.stablediffusionweb.com/2024/9/20/429d8690-5e85-4f07-a870-2e1fea6cad49.jpg" alt="Python">
            <h3>Python</h3>
            <p>Python is an easy-to-learn language widely used in data science and AI.</p>
            <button>Learn More</button>
        </div>

        <!-- Card 3 -->
        <div class="card">
            <img src="https://www.shutterstock.com/image-illustration/c-code-on-dark-background-260nw-1896170293.jpg" alt="C Language">
            <h3>C Language</h3>
            <p>C is a foundational programming language used for system and embedded software.</p>
            <button>Learn More</button>
        </div>

    </div>

</body>
</html>
